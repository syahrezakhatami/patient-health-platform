name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: php_admin
          POSTGRES_PASSWORD: php_admin_dev_only
          POSTGRES_DB: php_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U php_admin -d php_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://php_admin:php_admin_dev_only@localhost:5432/php_dev
      DATABASE_MIGRATION_URL: postgresql+asyncpg://php_admin:php_admin_dev_only@localhost:5432/php_dev
      TEST_DATABASE_URL: postgresql+asyncpg://php_admin:php_admin_dev_only@localhost:5432/php_dev
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0
      AUTH_DEV_HS256_SECRET: unit-test-hs256-secret-32b-minimum!!
      AUTH_ISSUER: http://localhost:8080/realms/php-dev
      AUTH_AUDIENCE: php-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests && ruff format --check app tests
      - name: Mypy
        run: mypy
      - name: Unit and security tests
        run: pytest tests/unit tests/security
      - name: Migrate
        run: alembic upgrade head
      - name: Integration tests
        run: pytest tests/integration
      - name: Dependency audit
        run: pip-audit --strict
